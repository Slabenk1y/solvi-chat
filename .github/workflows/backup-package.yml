name: SOLVI pre-monetization backup package

on:
  push:
    branches:
      - backup/pre-monetization-20261117

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backup branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install and validate
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Package backup source
        run: git archive --format=zip --prefix=solvi-chat-pre-monetization/ HEAD -o SOLVI-pre-monetization-backup.zip
      - name: Upload backup archive
        uses: actions/upload-artifact@v4
        with:
          name: solvi-chat-pre-monetization-backup
          path: SOLVI-pre-monetization-backup.zip
          if-no-files-found: error
          retention-days: 7
