name: SOVLI cloud control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action for the SOVLI Render service
        required: true
        type: choice
        options:
          - resume
          - restart
          - suspend

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "Missing repository secret RENDER_API_KEY"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Missing repository secret RENDER_SERVICE_ID"; exit 1; }

      - name: Apply requested Render action
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          ACTION_NAME: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION_NAME" in
            resume) ENDPOINT="resume" ;;
            restart) ENDPOINT="restart" ;;
            suspend) ENDPOINT="suspend" ;;
            *) echo "Unsupported action"; exit 1 ;;
          esac
          echo "Requesting Render action: $ACTION_NAME"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/$ENDPOINT" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY"
          echo
          echo "Render accepted the $ACTION_NAME request."
