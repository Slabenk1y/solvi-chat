name: SOLVI isolated preview package

on:
  push:
    branches:
      - feature/monetization-preview-20261117

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install and validate
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Package complete source
        run: git archive --format=zip --prefix=solvi-chat-preview/ HEAD -o solvi-chat-preview.zip
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: solvi-chat-preview
          path: solvi-chat-preview.zip
          if-no-files-found: error
          retention-days: 7
